services:
  mariadb:
    image: mariadb:10.11
    container_name: green_db
    ports:
      - "3306:3306"
    environment:
      # Credenziali del database (solo sviluppo)
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_green_school
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    volumes:
      # I dati del DB vengono persistiti in locale per non perderli al riavvio
      - ./docker-data/mysql:/var/lib/mysql
    networks:
      - green-network


  redis:
    image: redis:alpine
    container_name: green_redis
    networks:
      - green-network


  app:
    build: .
    container_name: green_app
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./vhost.conf:/etc/apache2/sites-available/000-default.conf
    command: sh -c "composer install --no-interaction && apache2-foreground"
    networks:
      - green-network
    depends_on:
      - mariadb
      - redis

  reverb:
    build: .                    # stessa immagine dell'app
    container_name: green_reverb
    ports:
      - "8080:8080"
    volumes:
      - ./src:/var/www/html     # stesso codice
    command: php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080
    networks:
      - green-network
    depends_on:
      - app
      - redis

  queue:
    build: .                    # stessa immagine dell'app
    container_name: green_queue
    volumes:
      - ./src:/var/www/html     # stesso codice
    command: php /var/www/html/artisan queue:work --sleep=3 --tries=3
    networks:
      - green-network
    depends_on:
      - app
      - redis

  python:
    build: ./simulatore
    container_name: green_simulatore
    volumes: 
      - ./simulatore:/simulatore
    environment:
      - PYTHONUNBUFFERED=1        # Fondamentale per vedere i print nei log
    networks:
      - green-network
    depends_on:
      - redis
      - reverb
      - mariadb
      - app

networks:
  # Rete bridge condivisa tra tutti i container per farli comunicare tra loro
  green-network:
    driver: bridge