name: gs

x-worker: &w
  build: ./simulatore
  tty: true
  stdin_open: true
  volumes:
    - ./simulatore:/simulatore
    - ./simulatore/params:/params
  networks:
    - green-network
  depends_on:
    app:
      condition: service_healthy   # aspetta che il backend risponda su /api/health
    redis:
      condition: service_started
    reverb:
      condition: service_started
    mariadb:
      condition: service_started
    mqtt:
      condition: service_started
  entrypoint: bash -c "exec python main.py"

services:
  mariadb:
    image: mariadb:10.11
    container_name: green_db
    ports:
      - "3306:3306"
    environment:
      # Credenziali del database (solo sviluppo)
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_green_school
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
     
    volumes:
      # I dati del DB vengono persistiti in locale per non perderli al riavvio
      - ./docker-data/mysql:/var/lib/mysql
    networks:
      - green-network


  redis:
    image: redis:alpine
    container_name: green_redis
    networks:
      - green-network


  app:
    build: ./backend
    container_name: green_app
    ports:
      - "80:80"
    volumes:
      - ./backend/src:/var/www/html
      - ./vhost.conf:/etc/apache2/sites-available/000-default.conf
    # NOTA SUI PERMESSI:
    # Dentro al container Apache/Laravel gira come utente "www-data", NON root.
    # La cartella ./backend/src e' un bind mount: i file mantengono owner e
    # permessi dell'host, non quelli del container. Quindi a "www-data" servono
    # i permessi di SCRITTURA su:
    #   - storage/         (cache, log, sessioni, file caricati)
    #   - bootstrap/cache/ (package manifest generato da composer install)
    # Su Windows (Docker Desktop) il mount e' di solito tutto accessibile e
    # "funziona e basta"; su Linux/Mac no: se i file appartengono a un altro
    # utente esce un errore tipo "directory must be present and writable".
    # Per questo facciamo il chmod a runtime, DOPO il mount del volume e PRIMA
    # che Laravel scriva (un chmod nel Dockerfile verrebbe coperto dal mount).
    # Stesso tipo di problema che puo' capitare a Mosquitto con config/data/log.
    command: >
      sh -c "mkdir -p bootstrap/cache &&
             chmod -R 777 storage bootstrap/cache &&
             composer install --no-interaction &&
             apache2-foreground"
    networks:
      - green-network
    depends_on:
      - mariadb
      - redis
      - mqtt
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 5s         # controlla ogni 5 secondi
      timeout: 3s          # timeout singola chiamata
      retries: 20          # dopo start_period aspetta fino a 100s (20 * 5s)
      start_period: 120s   # primi 120s i fallimenti non contano: composer install
                           # sul bind mount Windows puo' metterci diversi minuti

  reverb:
    build: ./backend                   # stessa immagine dell'app
    container_name: green_reverb
    ports:
      - "8080:8080"
    volumes:
      - ./backend/src:/var/www/html     # stesso codice
    command: php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080 --debug
    networks:
      - green-network
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_started
      mqtt:
        condition: service_started

  queue:
    build: ./backend                    # stessa immagine dell'app
    container_name: green_queue
    volumes:
      - ./backend/src:/var/www/html     # stesso codice
    command: php /var/www/html/artisan queue:work --sleep=3 --tries=3
    networks:
      - green-network
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_started
      mqtt:
        condition: service_started

  heartbeat_checker:
    build: ./backend
    container_name: green_heartbeat_checker
    volumes:
      - ./backend/src:/var/www/html
    command: php /var/www/html/artisan app:heartbeat-checker
    restart: unless-stopped
    networks:
      - green-network
    depends_on:
      app:
        condition: service_healthy
      mariadb:
        condition: service_started
      redis:
        condition: service_started
      reverb:
        condition: service_started
  mqtt-worker:
    build: ./backend                    # stessa immagine dell'app
    container_name: green_mqtt_worker
    volumes:
      - ./backend/src:/var/www/html
    command: php /var/www/html/artisan mqtt:leggi
    restart: unless-stopped
    networks:
      - green-network
    depends_on:
      app:
        condition: service_healthy   # gia' garantisce composer install completato
      mariadb:
        condition: service_started
      redis:
        condition: service_started
      mqtt:
        condition: service_started
      reverb:
        condition: service_started

  mqtt:
    image: eclipse-mosquitto:latest
    container_name: green_mqtt-broker
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt/config:/mosquitto/config
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log
    networks:
      - green-network
  
  worker-1:
    <<: *w
    environment: [PYTHONUNBUFFERED=1, WORKER_ENV_FILE=/params/worker-1.env]
  worker-2:
    <<: *w
    environment: [PYTHONUNBUFFERED=1, WORKER_ENV_FILE=/params/worker-2.env]
  worker-3:
    <<: *w
    environment: [PYTHONUNBUFFERED=1, WORKER_ENV_FILE=/params/worker-3.env]
  worker-4:
    <<: *w
    environment: [PYTHONUNBUFFERED=1, WORKER_ENV_FILE=/params/worker-4.env]
  worker-5:
    <<: *w
    environment: [PYTHONUNBUFFERED=1, WORKER_ENV_FILE=/params/worker-5.env]
  worker-6:
    <<: *w
    environment: [PYTHONUNBUFFERED=1, WORKER_ENV_FILE=/params/worker-6.env]
  worker-7:
    <<: *w
    environment: [PYTHONUNBUFFERED=1, WORKER_ENV_FILE=/params/worker-7.env]
    
  react:
    build: ./frontend
    container_name: green_react
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    networks:
      - green-network  # ← mancava
  

networks:
  # Rete bridge condivisa tra tutti i container per farli comunicare tra loro
  green-network:
    driver: bridge