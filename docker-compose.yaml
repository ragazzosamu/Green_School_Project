services:
  mariadb:
    image: mariadb:10.11
    container_name: green_db
    ports:
      - "3306:3306"
    environment:
      # Credenziali del database (solo sviluppo)
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_green_school
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    volumes:
      # I dati del DB vengono persistiti in locale per non perderli al riavvio
      - ./docker-data/mysql:/var/lib/mysql
    networks:
      - green-network

  app:
    build: .
    container_name: green_app
    ports:
      - "80:80"    # Apache
      - "8080:8080" # Reverb (WebSocket)
    volumes:
      # Il codice sorgente viene montato direttamente: le modifiche locali si riflettono subito nel container
      - ./src:/var/www/html
      # Configurazione virtuale di Apache montata dall'esterno per non ribuildaree l'immagine ad ogni modifica
      - ./vhost.conf:/etc/apache2/sites-available/000-default.conf
    # All'avvio: prima installa le dipendenze PHP, poi avvia Apache
    command: sh -c "composer install --no-interaction && apache2-foreground"
    networks:
      - green-network
    depends_on:
      - mariadb
      - redis

  redis:
    image: redis:alpine
    container_name: green_redis
    networks:
      - green-network

networks:
  # Rete bridge condivisa tra tutti i container per farli comunicare tra loro
  green-network:
    driver: bridge