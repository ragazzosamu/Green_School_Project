<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ─── Reverse proxy WebSocket Reverb ──────────────────────────────────
    # Echo del browser si connette a ws(s)://<dominio>/app/<key>?...
    # Apache lo tunnella verso il container 'reverb' sulla porta 8080.
    # Cosi' il WS viaggia sullo stesso dominio/porta del traffico HTTP,
    # passando senza problemi anche attraverso ngrok / un singolo tunnel.
    #
    # NB: NON aggiungiamo proxy su /apps/* perche' Laravel parla con Reverb
    # solo dalla rete Docker interna (REVERB_SERVER_HOST=reverb), e gli
    # endpoint /broadcasting/* sono route Laravel native, non vanno proxied.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/app/(.*)$ ws://reverb:8080/app/$1 [P,L]

    ProxyPass        /app/  ws://reverb:8080/app/
    ProxyPassReverse /app/  ws://reverb:8080/app/
</VirtualHost>
